<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Engineering Notes Hub</title>
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .admin-login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: var(--bg-surface);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .admin-login-container h2 {
            margin-bottom: 20px;
            color: var(--text-main);
        }
        .admin-login-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-page);
            color: var(--text-main);
        }
        .admin-login-container button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-login-container button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <i class="fa-solid fa-user-shield" style="font-size: 3rem; color: #2563eb; margin-bottom: 15px;"></i>
        <h2>Admin Login</h2>
        <form id="adminLoginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // Hardcoded admin logic for simplicity
            if (user === 'admin' && (pass === 'admin123' || pass === 'admin')) {
                localStorage.setItem('isAdminMode', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid admin credentials');
            }
        });
        
        // If already logged in, redirect to dashboard
        if (localStorage.getItem('isAdminMode') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
