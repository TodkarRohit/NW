<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Viewer | Engineering Notes Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="viewer.css">
</head>

<body>
    <!-- Top Header Navigation Bar -->
    <header class="viewer-header">
        <div class="header-left">
            <a href="index.html" class="back-btn" id="backToHome">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Subjects</span>
            </a>
            <div class="online-users-badge" id="onlineUsersBadge" title="Live students currently active on portal">
                <span class="online-pulse-dot"></span>
                <i class="fa-solid fa-users"></i>
                <span id="onlineUsersCount">18</span> Online
            </div>
            <div class="header-divider"></div>
            <div class="subject-meta">
                <span class="resource-badge" id="resourceTypeBadge">Study Notes</span>
                <h1 class="header-title" id="subjectHeading">Subject Name</h1>
            </div>
            <!-- Resource Type Quick Switcher Tabs -->
            <nav class="resource-switcher-nav">
                <a href="viewer.html?subject=dsa&type=notes" class="res-tab-pill" id="tabNotesLink">
                    <span>📖 Study Notes</span>
                </a>
                <a href="viewer.html?subject=dsa&type=qb" class="res-tab-pill" id="tabQbLink">
                    <span>❓ Question Banks</span>
                </a>
                <a href="assignments.html?subject=dsa" class="res-tab-pill" id="tabAssLink">
                    <span>📁 Assignments</span>
                </a>
            </nav>
        </div>

        <div class="header-actions">
            <!-- Hidden File Input for uploading note/assignment -->
            <input type="file" id="fileUploadInput" accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg" style="display: none;">
            
            <button class="action-btn upload-btn" id="uploadFileBtn" title="Upload Question Paper or Solution PDF">
                <i class="fa-solid fa-cloud-arrow-up"></i>
                <span id="uploadBtnText">Upload PDF</span>
            </button>

            <button class="action-btn primary-btn" id="downloadFileBtn" title="Download active PDF file">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span id="downloadBtnText">Download File</span>
            </button>

            <button class="action-btn" id="printBtn" title="Print this chapter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>Print</span>
            </button>

            <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle theme">
                <i class="fa-solid fa-moon"></i>
                <span class="theme-btn-text">Dark Mode</span>
            </button>

            <button class="mobile-toggle-btn" id="mobileSidebarToggle" aria-label="Toggle Chapter List">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main 2-Panel Layout (Left: Chapter Name, Right: Notes Preview) -->
    <div class="viewer-layout">
        
        <!-- Left Panel: Chapter Names / Modules List -->
        <aside class="sidebar-panel" id="sidebarPanel">
            <div class="sidebar-header">
                <div class="sidebar-title-row">
                    <h2 class="sidebar-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span id="sidebarSectionTitle">Chapter List</span>
                    </h2>
                    <span class="chapter-count" id="chapterCount">0 Items</span>
                </div>
                <div class="sidebar-search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="chapterSearchInput" placeholder="Filter items (Ctrl+K)..." autocomplete="off">
                    <button type="button" class="search-clear-btn" id="chapterSearchClearBtn" style="display:none;" title="Clear Search (Esc)">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- List of Chapters -->
            <nav class="chapter-list" id="chapterList" aria-label="Chapters navigation">
                <!-- Dynamically populated via viewer.js -->
            </nav>
        </aside>

        <!-- Sidebar Backdrop for Mobile -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Right Panel: Notes / Assignment Preview Window -->
        <main class="preview-panel" id="previewPanel">
            
            <!-- Document Meta Bar -->
            <div class="preview-meta-bar">
                <div class="meta-info">
                    <span class="meta-label">Selected Item:</span>
                    <strong class="current-chapter-title" id="currentChapterName">Loading...</strong>
                </div>
                <div class="status-indicator" id="itemUploadStatus">
                    <span class="status-dot"></span>
                    <span id="statusText">Ready for Upload</span>
                </div>
            </div>

            <!-- Notes Document / Assignment Preview Container -->
            <article class="notes-document" id="notesDocument">
                <!-- Dynamically populated via viewer.js (Clean Upload / Notes Structure) -->
            </article>

            <!-- Bottom Navigation -->
            <footer class="chapter-pagination">
                <button class="page-btn prev-btn" id="prevChapterBtn" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                    <div>
                        <span class="nav-direction">Previous</span>
                        <span class="nav-title" id="prevChapterTitle">None</span>
                    </div>
                </button>
                <button class="page-btn next-btn" id="nextChapterBtn">
                    <div>
                        <span class="nav-direction">Next</span>
                        <span class="nav-title" id="nextChapterTitle">Next Item</span>
                    </div>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </footer>
        </main>
    </div>

    <!-- Question Bank Upload Modal -->
    <div class="modal-backdrop" id="qbUploadModalBackdrop">
        <div class="modal-card">
            <div class="modal-header">
                <div class="modal-title-group">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: #059669; font-size: 1.3rem;"></i>
                    <h3 id="qbModalTitle">Upload Question Bank PDF</h3>
                </div>
                <button class="close-modal-btn" id="closeQbModalBtn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="qbUploadForm" class="modal-form">
                <div class="form-group">
                    <label for="qbModalItemSelect"><i class="fa-solid fa-folder-tree"></i> Select Target Unit / Chapter</label>
                    <select id="qbModalItemSelect" required>
                        <!-- Populated dynamically via viewer.js -->
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-layer-group"></i> Document Type to Upload</label>
                    <div class="doc-type-switcher">
                        <label class="doc-type-radio">
                            <input type="radio" name="qbUploadDocType" value="questions" checked>
                            <span><i class="fa-solid fa-file-circle-question" style="color:#0284c7"></i> Question Paper PDF</span>
                        </label>
                        <label class="doc-type-radio">
                            <input type="radio" name="qbUploadDocType" value="answers">
                            <span><i class="fa-solid fa-file-circle-check" style="color:#16a34a"></i> Model Solutions / Answer Key PDF</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="qbModalFileInput"><i class="fa-solid fa-file-pdf"></i> Select PDF Document</label>
                    <div class="file-dropzone" id="qbModalDropzone">
                        <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2rem; color: #059669;"></i>
                        <span class="file-name-display" id="qbModalFileNameDisplay">Drag & drop PDF here or click to browse</span>
                        <input type="file" id="qbModalFileInput" accept=".pdf,.doc,.docx,.txt" required>
                    </div>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" id="cancelQbModalBtn">Cancel</button>
                    <button type="submit" class="submit-upload-btn" id="submitQbUploadBtn">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Upload & Attach File
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">File uploaded successfully!</span>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="viewer.js"></script>
</body>

</html>
